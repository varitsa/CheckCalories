<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6FFF">
<title>CheckCalories - บันทึกแคลอรี่จากรูปอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1E6FFF; --blue-d:#0B3FA8; --blue-l:#EAF2FF; --blue-m:#A9C9FF;
  --yellow:#FFC933; --yellow-d:#E5A800; --on-yellow:#2A1E00;
  --ink:#0B1B3A; --muted:#5B6B8C; --bg:#F3F7FF; --card:#FFFFFF; --line:#DDE7FA;
  --brand-t:#1556D6; --danger:#D93B4B; --warn:#FF8A3D; --field:#F6F9FF;
  --shadow:0 8px 28px rgba(11,63,168,.10);
  --r:20px;
  font-family:"Prompt","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#EAF1FF; --muted:#9BB0D8; --bg:#08122B; --card:#0F1E42; --line:#1E3262;
    --blue-l:#13264F; --blue-m:#35589B; --brand-t:#7FB0FF; --field:#0B1838;
    --shadow:0 8px 28px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}
.ic{width:24px;height:24px;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:128px;position:relative}
@media (min-width:560px){ body{background:linear-gradient(180deg,#DCE9FF,#EEF4FF 40%)} .app{background:var(--bg);box-shadow:0 0 60px rgba(11,63,168,.12)} }
@media (min-width:560px) and (prefers-color-scheme:dark){ body{background:#050C1E} }

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 28px;border-radius:0 0 36px 36px;background:linear-gradient(165deg,#3B86FF 0%,#1E6FFF 42%,#0B3FA8 100%)}
.hero::before{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;background:var(--yellow)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-70px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:14px;opacity:.85}
.hero h1{font-size:26px;font-weight:600;letter-spacing:.2px;line-height:1.2}
.chip{background:var(--blue-d);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 4px 12px rgba(11,63,168,.35)}
.ring-wrap{position:relative;width:224px;height:224px;margin:14px auto 6px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{stroke:rgba(255,255,255,.2)}
.ring-bar{stroke:var(--yellow);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring-bar.over{stroke:var(--warn)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-size:50px;font-weight:700;line-height:1.05}
.ring-c span{font-size:14px;opacity:.85}
.status{text-align:center;font-weight:500;font-size:15px;margin-bottom:18px}
.status em{font-style:normal;background:rgba(255,255,255,.16);padding:4px 14px;border-radius:999px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macro small{display:block;font-size:12.5px;opacity:.85}
.macro b{font-size:15px;font-weight:600}
.macro i{display:block;height:7px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.macro i s{display:block;height:100%;border-radius:9px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}

/* list */
.sec{padding:22px 18px 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec-h h2{font-size:18px;font-weight:600}
.sec-h span{font-size:13.5px;color:var(--muted)}
.entry{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s}
.entry:active{transform:scale(.985)}
.entry img,.entry .ph{width:58px;height:58px;border-radius:14px;object-fit:cover;flex:none;background:var(--blue-l)}
.entry .ph{display:grid;place-items:center;color:var(--brand-t)}
.e-main{flex:1;min-width:0;display:flex;flex-direction:column}
.e-main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-main small{font-size:12.5px;color:var(--muted)}
.e-kcal{text-align:right}
.e-kcal b{display:block;font-size:20px;font-weight:700;color:var(--brand-t);line-height:1.1}
.e-kcal small{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:30px 20px;background:var(--card);border:1.5px dashed var(--blue-m);border-radius:var(--r)}
.empty svg{width:84px;height:84px;color:var(--blue);margin:0 auto 6px;display:block}
.empty b{display:block;font-size:17px}
.empty p{color:var(--muted);font-size:14px;margin-top:2px}
.banner{margin:16px 18px 0;background:var(--yellow);color:var(--on-yellow);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500}
.banner button{margin-left:auto;background:var(--blue-d);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.link{color:var(--brand-t);font-weight:500;font-size:14px;padding:6px 2px}

/* history */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.page-h{padding:calc(24px + env(safe-area-inset-top)) 18px 4px}
.page-h h1{font-size:26px;font-weight:600}
.page-h p{color:var(--muted);font-size:14px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .goal{stroke:var(--yellow-d);stroke-width:1.5;stroke-dasharray:5 5}
.chart .goal-t{fill:var(--yellow-d);font-size:10.5px;font-weight:500}
.chart .hit{fill:transparent}
.chart .bar{fill:var(--blue-m);transition:fill .2s}
.chart .bar.zero{opacity:.45}
.chart .col{cursor:pointer;outline:none}
.chart .col:focus-visible .bar{stroke:var(--yellow);stroke-width:3}
.chart .sel .bar{fill:var(--blue)}
.chart .val{fill:var(--muted);font-size:10.5px;font-weight:500}
.chart .sel .val{fill:var(--brand-t);font-weight:700}
.chart .dow{fill:var(--muted);font-size:11px;text-anchor:middle}
.chart .dnum{fill:var(--ink);font-size:11.5px;font-weight:500;text-anchor:middle}
.chart .chip-t{fill:var(--yellow)}
.chart .today .dnum{fill:var(--on-yellow);font-weight:700}
.avg{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:8px}
.avg b{color:var(--ink)}

/* settings */
.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
.inp{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,111,255,.16)}
.row{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:8px 14px;border-radius:999px;background:var(--blue-l);color:var(--brand-t);font-size:14px;font-weight:500;min-height:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;font-weight:600;font-size:16px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.97)}
.btn-y{background:var(--yellow);color:var(--on-yellow);box-shadow:0 8px 18px rgba(255,201,51,.4)}
.btn-b{background:var(--blue);color:#fff}
.btn-o{border:1.5px solid var(--line);color:var(--ink)}
.btn-d{border:1.5px solid var(--danger);color:var(--danger)}
.btn-d.arm{background:var(--danger);color:#fff}
.btn-w{width:100%}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* nav */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);z-index:20;background:var(--blue-d);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(11,63,168,.28)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.72);font-size:12px;min-height:52px;justify-content:center;border-radius:14px;text-align:center}
.nav button[aria-current=page]{color:var(--yellow);font-weight:600}
.nav .fab{margin-top:-34px;height:70px;width:70px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);justify-self:center;border:5px solid var(--bg);box-shadow:0 10px 22px rgba(255,201,51,.5);min-height:0;transition:transform .15s}
.nav .fab:active{transform:scale(.93)}
.nav .fab .ic{width:30px;height:30px}

/* sheet */
.bg{position:fixed;inset:0;background:rgba(8,18,43,.58);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,520px);max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;z-index:50;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-title{font-size:20px;font-weight:600}
.sh-sub{color:var(--muted);font-size:14px;margin-top:2px}
.sh-img{position:relative;border-radius:20px;overflow:hidden;margin:6px 0 16px;background:var(--blue-l);max-height:200px}
.sh-img img{width:100%;height:200px;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(180deg,transparent,rgba(255,201,51,.75));animation:scan 1.6s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.ai-note{background:var(--blue-l);color:var(--brand-t);padding:10px 14px;border-radius:14px;font-size:13.5px;margin-bottom:12px}
.item{border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;background:var(--field)}
.item-h{display:flex;gap:8px;align-items:center}
.item-h .inp{font-weight:600}
.item .rm{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.grid4{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.grid4 label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.grid4 .inp{padding:9px 10px;min-height:44px;text-align:center}
.grid4 .k label{color:var(--brand-t);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 14px;font-weight:500}
.total b{font-size:26px;color:var(--brand-t)}
.err{background:rgba(217,59,75,.1);color:var(--danger);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:10px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>

<nav class="nav" aria-label="เมนูหลัก">
  <button data-tab="today" id="navToday"></button>
  <button data-tab="history" id="navHistory"></button>
  <button class="fab" data-act="cam" aria-label="ถ่ายรูปอาหาร" id="navCam"></button>
  <button data-act="gal" id="navGal"></button>
  <button data-tab="settings" id="navSettings"></button>
</nav>

<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>
<div class="bg" id="bg" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="รายละเอียดอาหาร"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n || 0).toLocaleString("en-US");
const r1 = n => Math.round((n || 0) * 10) / 10;
const pad = n => String(n).padStart(2, "0");
const dkey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dfmt = k => { const [y, m, d] = k.split("-"); return `${d}/${m}/${y}`; };
const tfmt = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DOW_FULL = ["วันอาทิตย์","วันจันทร์","วันอังคาร","วันพุธ","วันพฤหัสบดี","วันศุกร์","วันเสาร์"];
const DOW_SHORT = ["อา","จ","อ","พ","พฤ","ศ","ส"];

const P = {
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  chart: '<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V7M18 17v-8"/>',
  sliders: '<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  plate: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>'
};
const I = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- storage ---------- */
const KEY = "cc.v1";
const DEF = { settings: { apiKey: "", model: "gpt-4o-mini", goal: 2000 }, entries: [] };
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || "null");
    if (j) return { settings: { ...DEF.settings, ...j.settings }, entries: Array.isArray(j.entries) ? j.entries : [] };
  } catch (e) {}
  return structuredClone(DEF);
}
const DB = load();
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch (e) { toast("พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม หรือถูกปิดการใช้งาน"); return false; }
}

/* ---------- state ---------- */
const todayKey = () => dkey(Date.now());
const S = { tab: "today", sel: todayKey() };
function dayEntries(k) { return DB.entries.filter(e => dkey(e.ts) === k).sort((a, b) => a.ts - b.ts); }
function sumOf(list) { return list.reduce((t, e) => ({ kcal: t.kcal + e.kcal, p: t.p + e.p, c: t.c + e.c, f: t.f + e.f }), { kcal: 0, p: 0, c: 0, f: 0 }); }
function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = dkey(d.getTime());
    out.push({ key, dow: d.getDay(), date: d.getDate(), today: i === 0, ...sumOf(dayEntries(key)) });
  }
  return out;
}

/* ---------- views ---------- */
function entryHtml(e) {
  return `<button class="entry" data-edit="${e.id}" aria-label="แก้ไข ${esc(e.name)}">
    ${e.thumb ? `<img src="${e.thumb}" alt="">` : `<span class="ph">${I("plate")}</span>`}
    <span class="e-main"><b>${esc(e.name)}</b>
      <small>โปรตีน ${fmt(e.p)} · คาร์บ ${fmt(e.c)} · ไขมัน ${fmt(e.f)} ก.</small>
      <small class="num">${tfmt(e.ts)}</small></span>
    <span class="e-kcal num"><b>${fmt(e.kcal)}</b><small>kcal</small></span>
  </button>`;
}
const emptyHtml = `<div class="empty">
  <svg viewBox="0 0 96 96" fill="none" aria-hidden="true"><circle cx="48" cy="52" r="34" fill="currentColor" opacity=".12"/><circle cx="48" cy="52" r="26" stroke="currentColor" stroke-width="4"/><circle cx="48" cy="52" r="15" stroke="currentColor" stroke-width="3" opacity=".5"/><path d="M14 14v22M20 14v22M26 14v22M14 24h12M20 36v22" stroke="#FFC933" stroke-width="4" stroke-linecap="round"/><path d="M82 14c-6 4-8 12-8 20h8V14zM82 34v26" stroke="#FFC933" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <b>ยังไม่มีมื้ออาหารวันนี้</b><p>กดปุ่มกล้องสีเหลืองเพื่อถ่ายรูปอาหารและเริ่มบันทึก</p></div>`;

function viewToday() {
  const k = todayKey(), list = dayEntries(k), t = sumOf(list), goal = DB.settings.goal;
  const left = goal - t.kcal, over = left < 0;
  const tg = { p: goal * .25 / 4, c: goal * .5 / 4, f: goal * .25 / 9 };
  const C = 2 * Math.PI * 92;
  const m = (label, val, target, col) => `<div class="macro"><small>${label}</small><b class="num">${fmt(val)} <small style="display:inline">/ ${fmt(target)} ก.</small></b><i><s data-w="${Math.min(100, val / target * 100)}" style="background:${col}"></s></i></div>`;
  return `
  <section class="hero">
    <div class="hero-top"><div><p class="eyebrow">${DOW_FULL[new Date().getDay()]}</p><h1 class="num">${dfmt(k)}</h1></div>
      <span class="chip num">เป้าหมาย ${fmt(goal)} kcal</span></div>
    <div class="ring-wrap" role="img" aria-label="กินไปแล้ว ${fmt(t.kcal)} จาก ${fmt(goal)} แคลอรี่">
      <svg viewBox="0 0 224 224"><circle class="ring-track" cx="112" cy="112" r="92" fill="none" stroke-width="16"/>
        <circle class="ring-bar${over ? " over" : ""}" id="ringBar" cx="112" cy="112" r="92" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-c="${C}" data-p="${goal ? Math.min(1, t.kcal / goal) : 0}"/></svg>
      <div class="ring-c"><b class="num" id="ringNum" data-to="${t.kcal}">0</b><span>kcal ที่ได้รับวันนี้</span></div>
    </div>

function chartSvg(days, goal, sel) {
  const W = 340, H = 214, top = 28, bot = 44, bw = 30, n = days.length, gap = (W - 16 - bw * n) / (n - 1);
  const max = Math.max(goal, ...days.map(d => d.kcal), 1) * 1.1;
  const y = v => top + (H - top - bot) * (1 - v / max);
  const gy = y(goal);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="กราฟแคลอรี่ 7 วันย้อนหลัง">
    <line class="goal" x1="0" x2="${W}" y1="${gy}" y2="${gy}"/><text class="goal-t num" x="${W}" y="${gy - 5}" text-anchor="end">เป้าหมาย ${fmt(goal)}</text>`;
  days.forEach((d, i) => {
    const x = 8 + i * (bw + gap), cx = x + bw / 2;
    const h = d.kcal ? Math.max(4, H - bot - y(d.kcal)) : 3, yy = H - bot - h;
    s += `<g class="col${d.key === sel ? " sel" : ""}${d.today ? " today" : ""}" data-day="${d.key}" tabindex="0" role="button" aria-label="${dfmt(d.key)} ${fmt(d.kcal)} kcal">
      <rect class="hit" x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H}"/>
      <rect class="bar${d.kcal ? "" : " zero"}" x="${x}" y="${yy}" width="${bw}" height="${h}" rx="9"/>
      ${d.kcal ? `<text class="val num" x="${cx}" y="${yy - 6}" text-anchor="middle">${fmt(d.kcal)}</text>` : ""}
      <text class="dow" x="${cx}" y="${H - 24}">${DOW_SHORT[d.dow]}</text>
      ${d.today ? `<rect class="chip-t" x="${cx - 14}" y="${H - 19}" width="28" height="19" rx="9.5"/>` : ""}
      <text class="dnum num" x="${cx}" y="${H - 5}">${d.date}</text></g>`;
  });
  return s + "</svg>";
}

function saveSheet() {
  const rows = Sh.rows.map(r => ({ name: String(r.name).trim(), kcal: Math.round(parseFloat(r.kcal) || 0), p: r1(parseFloat(r.p) || 0), c: r1(parseFloat(r.c) || 0), f: r1(parseFloat(r.f) || 0) }));
  if (rows.some(r => !r.name)) return toast("กรุณาใส่ชื่อเมนูให้ครบ");

  else { const now = Date.now(); rows.forEach((r, i) => DB.entries.push({ id: uid(), ts: now + i, ...r, thumb: Sh.thumb || "" })); }

/* ---------- AI ---------- */
const SCHEMA = { type: "object", additionalProperties: false, required: ["items", "note"], properties: {
  note: { type: "string" },
  items: { type: "array", items: { type: "object", additionalProperties: false, required: ["name", "kcal", "protein", "carbs", "fat"],
    properties: { name: { type: "string" }, kcal: { type: "number" }, protein: { type: "number" }, carbs: { type: "number" }, fat: { type: "number" } } } } } };
const PROMPT = "คุณเป็นนักโภชนาการ ดูรูปอาหารแล้วระบุเมนูทุกอย่างที่เห็น ตั้งชื่อเมนูเป็นภาษาไทยสั้น ๆ (เช่น ข้าวผัดกะเพราไก่ไข่ดาว) " +
  "ประเมินแคลอรี่ (kcal) และสารอาหารหลัก (โปรตีน คาร์บ ไขมัน หน่วยกรัม) ของปริมาณที่เห็นในรูป ต่อ 1 เมนู " +
  "ถ้ารูปไม่ใช่อาหาร ให้ items เป็นอาร์เรย์ว่าง ช่อง note เขียนอธิบายสั้น ๆ เป็นภาษาไทย (เช่น สมมติฐานเรื่องปริมาณ หรือความไม่แน่นอน)";
async function analyze(dataUrl) {
  const { apiKey, model } = DB.settings;
  if (!apiKey) throw { code: "nokey" };
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + apiKey },
      body: JSON.stringify({ model: model || "gpt-4o-mini", response_format: { type: "json_schema", json_schema: { name: "meal", strict: true, schema: SCHEMA } },
        messages: [{ role: "system", content: PROMPT }, { role: "user", content: [{ type: "text", text: "วิเคราะห์อาหารในรูปนี้" }, { type: "image_url", image_url: { url: dataUrl } }] }] })
    });
  } catch (e) { throw { code: "network" }; }
  if (!res.ok) { let m = ""; try { m = (await res.json()).error.message; } catch (e) {} throw { code: res.status, msg: m }; }
  const j = await res.json(), msg = j.choices?.[0]?.message;
  if (msg?.refusal) throw { code: "refusal", msg: msg.refusal };
  try { const d = JSON.parse(msg.content); if (!Array.isArray(d.items)) throw 0; return d; } catch (e) { throw { code: "parse" }; }
}
function errText(e) {
  if (e.code === "nokey") return "ยังไม่ได้ใส่ OpenAI API key ในหน้าตั้งค่า";
  if (e.code === "network") return "เชื่อมต่อ OpenAI ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง";
  if (e.code === 401) return "API key ไม่ถูกต้องหรือหมดอายุ ตรวจสอบในหน้าตั้งค่า";
  if (e.code === 429) return "ใช้งานถี่เกินไปหรือเครดิตของบัญชี OpenAI หมด ลองใหม่ภายหลัง";
  if (e.code === 404 || e.code === 400) return "โมเดลนี้ใช้ไม่ได้ หรือไม่รองรับการอ่านรูป" + (e.msg ? ` (${e.msg})` : "");
  if (e.code === "parse" || e.code === "refusal") return "AI ตอบกลับในรูปแบบที่อ่านไม่ได้ ลองอีกครั้งหรือกรอกเอง";
  return `เกิดข้อผิดพลาดจาก OpenAI (${e.code})` + (e.msg ? `: ${e.msg}` : "");
}
async function runAnalyze() {
  const my = Sh; my.mode = "analyze"; renderSheet();
  try {
    const d = await analyze(my.img);
    if (Sh !== my) return;
    my.rows = d.items.map(x => ({ name: x.name, kcal: Math.round(x.kcal), p: r1(x.protein), c: r1(x.carbs), f: r1(x.fat) }));
    my.note = d.note || "";
    if (!my.rows.length) { my.rows = [blank()]; my.note = my.note || "AI ไม่พบอาหารในรูปนี้ กรอกเองได้เลย"; }
    my.mode = "form";
  } catch (e) { if (Sh !== my) return; my.mode = "error"; my.code = e.code; my.err = errText(e); }
  renderSheet();
}

/* ---------- image ---------- */
function loadImg(file) { return new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); no(); }; i.src = u; }); }
function scaled(img, max, q) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function onFile(file) {
  if (!file) return;
  let img; try { img = await loadImg(file); } catch (e) { return toast("เปิดรูปนี้ไม่ได้ ลองใช้รูป JPG หรือ PNG"); }
  openSheet({ mode: "analyze", img: scaled(img, 768, .82), thumb: scaled(img, 160, .7), rows: [], note: "" });
  runAnalyze();
}
["fCam", "fGal"].forEach(id => $("#" + id).addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; onFile(f); }));

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-act],[data-edit],[data-day]");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; armClear = false; return render(); }
  if (t.dataset.day) { S.sel = t.dataset.day; return render(); }
  if (t.dataset.edit) {
    const en = DB.entries.find(x => x.id === t.dataset.edit); if (!en) return;
    return openSheet({ mode: "edit", editId: en.id, img: en.thumb, thumb: en.thumb, note: "", rows: [{ name: en.name, kcal: en.kcal, p: en.p, c: en.c, f: en.f }] });
  }
  const a = t.dataset.act;
  if (a === "cam") $("#fCam").click();
  else if (a === "gal") $("#fGal").click();
  else if (a === "manual") openSheet({ mode: "form", img: "", thumb: "", note: "", rows: [blank()] });
  else if (a === "close") closeSheet();
  else if (a === "retry") runAnalyze();
  else if (a === "manualfill") { Sh.rows = [blank()]; Sh.mode = "form"; renderSheet(); }
  else if (a === "tosettings") { closeSheet(); S.tab = "settings"; render(); }
  else if (a === "addrow") { Sh.rows.push(blank()); renderSheet(); }
  else if (a === "delrow") { Sh.rows.splice(+t.dataset.i, 1); renderSheet(); }
  else if (a === "save") saveSheet();
  else if (a === "del") {
    if (!armDel) { armDel = true; return renderSheet(); }
    DB.entries = DB.entries.filter(x => x.id !== Sh.editId); persist(); closeSheet(); render(); toast("ลบรายการแล้ว");
  }
  else if (a === "togglekey") { const i = $("#sKey"); i.type = i.type === "password" ? "text" : "password"; }
  else if (a === "preset") $("#sGoal").value = t.dataset.v;
  else if (a === "savesettings") {
    const goal = parseInt($("#sGoal").value, 10);
    if (!(goal >= 500 && goal <= 10000)) return toast("เป้าหมายแคลอรี่ควรอยู่ระหว่าง 500 - 10,000");
    DB.settings = { apiKey: $("#sKey").value.trim(), model: $("#sModel").value.trim() || "gpt-4o-mini", goal };
    if (persist()) toast("บันทึกการตั้งค่าแล้ว");
  }
  else if (a === "clear") {
    if (!armClear) { armClear = true; return render(); }
    DB.entries = []; armClear = false; persist(); render(); toast("ลบข้อมูลทั้งหมดแล้ว");
  }
});
document.addEventListener("input", e => {
  const el = e.target; if (!Sh || el.dataset.i === undefined) return;
  Sh.rows[+el.dataset.i][el.dataset.f] = el.value;
  if (el.dataset.f === "kcal") $("#shTotal").textContent = fmt(shTotal());
});
